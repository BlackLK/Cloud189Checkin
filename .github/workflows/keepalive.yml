name: Keepalive - 防止定时工作流被 GitHub 自动禁用

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
